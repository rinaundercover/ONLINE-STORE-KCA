<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I-DOLL — COLLECTION</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, Helvetica, sans-serif;
}

nav {
    height: 80px;
    padding: 0 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eeeeee;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.coins {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    gap: 35px;
}

.nav-links a {
    color: black;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
}

.nav-links a:hover {
    text-decoration: underline;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 70px 30px;
}

.header {
    text-align: center;
    margin-bottom: 50px;
}

.header h1 {
    font-size: 45px;
    letter-spacing: 5px;
    margin: 0 0 15px;
}

.counter {
    font-size: 12px;
    letter-spacing: 2px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 25px;
}

.slot {
    position: relative;
    aspect-ratio: 2 / 3;
    border: 1px solid #ddd;
    overflow: hidden;
    background: #fafafa;
}

.slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.locked {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
}

.question {
    font-size: 40px;
    font-weight: bold;
}

.locked-text {
    font-size: 9px;
    letter-spacing: 2px;
}

.number {
    position: absolute;
    left: 8px;
    top: 8px;
    background: white;
    padding: 4px 7px;
    font-size: 9px;
    font-weight: bold;
}

.count {
    position: absolute;
    right: 8px;
    top: 8px;
    background: black;
    color: white;
    padding: 5px 7px;
    font-size: 9px;
    font-weight: bold;
}

@media (max-width: 900px) {

    .grid {
        grid-template-columns: repeat(4, 1fr);
    }

}

@media (max-width: 750px) {

    nav {
        padding: 0 20px;
    }

    .nav-links {
        gap: 15px;
    }

    .nav-links a {
        font-size: 10px;
    }

    .logo {
        font-size: 16px;
    }

    .coins {
        font-size: 9px;
    }

    .logo-area {
        gap: 10px;
    }

}

@media (max-width: 650px) {

    .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

}

</style>

</head>

<body>

<nav>

    <div class="logo-area">

        <div class="logo">
            I-DOLL
        </div>

   <nav>

    <div class="coins">
        🪙 <span id="coinBalance">0</span>
    </div>

    <div class="nav-links">

        <a href="index.html">HOME</a>
        <a href="store.html">STORE</a>
        <a href="collection.html">COLLECTION</a>
        <a href="market.html">I-DOLL MARKET</a>

    </div>

</nav>

<div class="container">

    <div class="header">

        <h1>
            COLLECTION
        </h1>

        <div class="counter">

            <span id="ownedCount">
                0
            </span>
            / 100

        </div>

    </div>


    <div
        class="grid"
        id="collectionGrid"
    ></div>

</div>


<script>

const cards = [

    {
        file: "IMG_6687.PNG",
        number: "001"
    },

    {
        file: "IMG_6688.PNG",
        number: "002"
    },

    {
        file: "IMG_6689.PNG",
        number: "003"
    },

    {
        file: "IMG_6690.PNG",
        number: "004"
    },

    {
        file: "IMG_6691.PNG",
        number: "005"
    },

    {
        file: "IMG_6692.PNG",
        number: "006"
    },

    {
        file: "IMG_6693.PNG",
        number: "007"
    },

    {
        file: "IMG_6694.PNG",
        number: "008"
    },

    {
        file: "IMG_6695.PNG",
        number: "009"
    },

    {
        file: "IMG_6696.PNG",
        number: "010"
    },

    {
        file: "IMG_6697.PNG",
        number: "011"
    },

    {
        file: "IMG_6698.PNG",
        number: "012"
    },

    {
        file: "IMG_6699.PNG",
        number: "013"
    },

    {
        file: "IMG_6700.PNG",
        number: "014"
    },

    {
        file: "IMG_6701.PNG",
        number: "015"
    }

];


let collection = JSON.parse(
    localStorage.getItem("idollCollection")
) || {};


const grid = document.getElementById(
    "collectionGrid"
);


let owned = 0;


for (let i = 1; i <= 100; i++) {

    const slot = document.createElement("div");

    slot.className = "slot";


    const number = document.createElement("div");

    number.className = "number";

    number.textContent =
        String(i).padStart(3, "0");

    slot.appendChild(number);


    const card = cards[i - 1];


    if (card && collection[card.file]) {

        owned++;


        const image =
            document.createElement("img");

        image.src = card.file;

        image.alt =
            "I-DOLL card " + card.number;

        slot.appendChild(image);


        slot.style.cursor = "pointer";


        slot.addEventListener(
            "click",
            function() {

                window.location.href =
                    "card.html?card=" +
                    encodeURIComponent(
                        card.file
                    );

            }
        );


        if (collection[card.file] > 1) {

            const count =
                document.createElement("div");

            count.className = "count";

            count.textContent =
                "×" + collection[card.file];

            slot.appendChild(count);

        }

    } else {

        const locked =
            document.createElement("div");

        locked.className = "locked";


        const question =
            document.createElement("div");

        question.className = "question";

        question.textContent = "?";


        const lockedText =
            document.createElement("div");

        lockedText.className =
            "locked-text";

        lockedText.textContent =
            "LOCKED";


        locked.appendChild(question);

        locked.appendChild(lockedText);

        slot.appendChild(locked);

    }


    grid.appendChild(slot);

}


document.getElementById(
    "ownedCount"
).textContent = owned;


let coins =
    Number(
        localStorage.getItem("idollCoins")
    ) || 0;


document.getElementById(
    "coinBalance"
).textContent = coins;

</script>

</body>
</html>
