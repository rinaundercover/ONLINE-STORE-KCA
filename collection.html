<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL — Collection</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* NAVIGATION */

        nav {
            height: 80px;
            padding: 0 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            color: black;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* COLLECTION */

        .collection {
            max-width: 1200px;
            margin: auto;
            padding: 80px 40px;
        }

        .collection-header {
            margin-bottom: 60px;
        }

        .collection-header h1 {
            font-size: 55px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .collection-header p {
            font-size: 14px;
            color: #666666;
        }

        /* COLLECTION STATS */

        .stats {
            border-top: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;

            padding: 20px 0;

            margin-bottom: 60px;

            display: flex;
            justify-content: space-between;

            font-size: 12px;
            letter-spacing: 1px;
        }

        /* ALBUM */

        .album-section {
            margin-bottom: 80px;
        }

        .album-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* CARDS */

        .cards {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 18px;
        }

        .card {
            position: relative;

            aspect-ratio: 2 / 3;

            background: #f2f2f2;

            border: 1px solid #e5e5e5;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* LOCKED CARD */

        .locked {
            background: #f5f5f5;
            color: #aaaaaa;
        }

        .locked .card-number {
            font-size: 11px;
            letter-spacing: 1px;
        }

        .locked-text {
            position: absolute;

            bottom: 15px;

            font-size: 9px;

            letter-spacing: 2px;

            color: #aaaaaa;
        }

        /* OWNED CARD */

        .card img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        /* CARD NUMBER */

        .card-number {
            position: absolute;

            top: 10px;
            left: 10px;

            z-index: 2;

            background: white;

            padding: 5px 7px;

            font-size: 10px;

            letter-spacing: 1px;

            border: 1px solid #dddddd;
        }

        /* DUPLICATE COUNT */

        .duplicate-count {
            position: absolute;

            top: 10px;
            right: 10px;

            z-index: 3;

            min-width: 28px;
            height: 28px;

            padding: 0 7px;

            background: black;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 10px;
            font-weight: bold;

            letter-spacing: 1px;
        }

        /* HIDDEN IMAGE */

        .hidden-card {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question {
            font-size: 28px;
            color: #cccccc;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .collection {
                padding: 50px 20px;
            }

            .collection-header h1 {
                font-size: 42px;
            }

            .cards {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 450px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            I-DOLL
        </div>

        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="store.html">
                STORE
            </a>

            <a href="collection.html">
                COLLECTION
            </a>

        </div>

    </nav>


    <!-- COLLECTION -->

    <main class="collection">


        <div class="collection-header">

            <h1>
                COLLECTION
            </h1>

            <p>
                Your personal I-DOLL collection.
            </p>

        </div>


        <!-- STATS -->

        <div class="stats">

            <span>
                CARDS COLLECTED
            </span>

            <span id="collectionCount">
                0 / 100
            </span>

        </div>


        <!-- FIRST COLLECTION -->

        <section class="album-section">

            <div class="album-title">
                PHANTOM OF THE SPADE
            </div>

            <div class="cards" id="cardGrid">

            </div>

        </section>


    </main>


    <script>

        /* =========================================
           ALL 100 COLLECTION SLOTS
        ========================================= */

        const cards = [

            {
                slot: "001",
                file: "IMG_6687.PNG"
            },

            {
                slot: "002",
                file: "IMG_6688.PNG"
            },

            {
                slot: "003",
                file: "IMG_6689.PNG"
            },

            {
                slot: "004",
                file: "IMG_6690.PNG"
            },

            {
                slot: "005",
                file: "IMG_6691.PNG"
            },

            {
                slot: "006",
                file: "IMG_6692.PNG"
            },

            {
                slot: "007",
                file: "IMG_6693.PNG"
            },

            {
                slot: "008",
                file: "IMG_6694.PNG"
            },

            {
                slot: "009",
                file: "IMG_6695.PNG"
            },

            {
                slot: "010",
                file: "IMG_6696.PNG"
            },

            {
                slot: "011",
                file: "IMG_6697.PNG"
            },

            {
                slot: "012",
                file: "IMG_6698.PNG"
            },

            {
                slot: "013",
                file: "IMG_6699.PNG"
            },

            {
                slot: "014",
                file: "IMG_6700.PNG"
            },

            {
                slot: "015",
                file: "IMG_6701.PNG"
            }

        ];


        /* =========================================
           LOAD SAVED COLLECTION
        ========================================= */

        let collection = JSON.parse(
            localStorage.getItem("idollCollection")
        ) || {};


        /* =========================================
           CREATE 100 SLOTS
        ========================================= */

        const grid = document.getElementById("cardGrid");

        for (let i = 1; i <= 100; i++) {

            const slotNumber = String(i).padStart(3, "0");

            const card = cards.find(
                card => card.slot === slotNumber
            );

            const cardElement = document.createElement("div");

            cardElement.className = "card";


            /* OWNED CARD */

            if (card && collection[card.file]) {

                const image = document.createElement("img");

                image.src = card.file;

                image.alt = "I-DOLL photocard " + slotNumber;

                cardElement.appendChild(image);


                /* CARD NUMBER */

                const number = document.createElement("div");

                number.className = "card-number";

                number.textContent = slotNumber;

                cardElement.appendChild(number);

/* OPEN CARD INFO */

cardElement.style.cursor = "pointer";

cardElement.addEventListener("click", function() {
    window.location.href = "card.html?card=" + encodeURIComponent(card.file);
});
                
                /* DUPLICATE COUNT */

                const count = collection[card.file];

                if (count > 1) {

                    const duplicate = document.createElement("div");

                    duplicate.className = "duplicate-count";

                    duplicate.textContent = "×" + count;

                    cardElement.appendChild(duplicate);

                }

            }


            /* UNOWNED CARD */

            else {

                cardElement.classList.add("locked");


                const number = document.createElement("div");

                number.className = "card-number";

                number.textContent = slotNumber;

                cardElement.appendChild(number);


                const hidden = document.createElement("div");

                hidden.className = "hidden-card";


                const question = document.createElement("div");

                question.className = "question";

                question.textContent = "?";

                hidden.appendChild(question);


                cardElement.appendChild(hidden);


                const lockedText = document.createElement("div");

                lockedText.className = "locked-text";

                lockedText.textContent = "LOCKED";

                cardElement.appendChild(lockedText);

            }


            grid.appendChild(cardElement);

        }


        /* =========================================
           UPDATE COLLECTION COUNTER
        ========================================= */

        let collected = 0;

        cards.forEach(card => {

            if (collection[card.file]) {

                collected++;

            }

        });


        document.getElementById(
            "collectionCount"
        ).textContent = collected + " / 100";


    </script>


</body>

</html>
