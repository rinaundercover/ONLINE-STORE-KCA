<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL | Card Info</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            border-bottom: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: black;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        .page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .card-info {
            width: 900px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .card-image {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 2 / 3;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .details {
            border-left: 1px solid black;
            padding-left: 45px;
        }

        .small-title {
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .info-row {
            border-top: 1px solid black;
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .info-label {
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .info-value {
            font-size: 13px;
            text-align: right;
        }

        .rarity {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            border: 1px solid black;
            color: black;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .back-button:hover {
            background: black;
            color: white;
        }

        .error {
            text-align: center;
        }

        .error h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .card-info {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .details {
                border-left: none;
                border-top: 1px solid black;
                padding-left: 0;
                padding-top: 30px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">I-DOLL</div>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="store.html">STORE</a>
            <a href="collection.html">COLLECTION</a>
        </div>
    </nav>

    <main class="page">

        <div class="card-info" id="cardInfo"></div>

    </main>

    <script>

        const cards = {

            "IMG_6687.PNG": {
                number: "001",
                member: "DAL",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6688.PNG": {
                number: "002",
                member: "DAL",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6689.PNG": {
                number: "003",
                member: "DAL",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6690.PNG": {
                number: "004",
                member: "HAL",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6691.PNG": {
                number: "005",
                member: "HAL",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6692.PNG": {
                number: "006",
                member: "HAL",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6693.PNG": {
                number: "007",
                member: "KOALA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6694.PNG": {
                number: "008",
                member: "KOALA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6695.PNG": {
                number: "009",
                member: "KOALA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6696.PNG": {
                number: "010",
                member: "RIA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6697.PNG": {
                number: "011",
                member: "RIA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6698.PNG": {
                number: "012",
                member: "RIA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6699.PNG": {
                number: "013",
                member: "Z",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6700.PNG": {
                number: "014",
                member: "Z",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6701.PNG": {
                number: "015",
                member: "Z",
                rarity: "COMMON",
                version: "REGULAR"
            }

        };


        const file = new URLSearchParams(window.location.search).get("card");

        const card = cards[file];

        const container = document.getElementById("cardInfo");


        if (!card) {

            container.innerHTML = `
                <div class="error">
                    <h1>CARD NOT FOUND</h1>
                    <p>This card doesn't exist in the I-DOLL collection.</p>
                    <a href="collection.html" class="back-button">
                        BACK TO COLLECTION
                    </a>
                </div>
            `;

        } else {

            container.innerHTML = `
                
                <div class="card-image">
                    <img src="${file}" alt="${card.member} card">
                </div>

                <div class="details">

                    <div class="small-title">
                        I-DOLL · CARD ${card.number}
                    </div>

                    <h1>${card.member}</h1>

                    <div class="info-row">
                        <span class="info-label">CARD NUMBER</span>
                        <span class="info-value">${card.number}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">MEMBER</span>
                        <span class="info-value">${card.member}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">RARITY</span>
                        <span class="info-value rarity">${card.rarity}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">VERSION</span>
                        <span class="info-value">${card.version}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">ALBUM</span>
                        <span class="info-value">PHANTOM OF THE SPADE</span>
                    </div>

                    <a href="collection.html" class="back-button">
                        ← BACK TO COLLECTION
                    </a>

                </div>
            `;
        }

    </script>

</body>
</html>
