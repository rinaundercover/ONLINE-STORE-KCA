<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL | Card Info</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            height: 70px;
            border-bottom: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }


        .coins {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }


        .nav-links {
            display: flex;
            gap: 30px;
        }


        .nav-links a {
            color: black;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        .nav-links a:hover {
            opacity: 0.5;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }


        .card-info {
            width: 900px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }


        /* =========================================
           CARD DISPLAY
        ========================================= */

        .card-image {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 2 / 3;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }


        .card-stack {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card-stack > img.card-base {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }


        .card-decoration {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }


        /* =========================================
           DETAILS
        ========================================= */

        .details {
            border-left: 1px solid black;
            padding-left: 45px;
        }


        .small-title {
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }


        h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }


        .info-row {
            border-top: 1px solid black;
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }


        .info-label {
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
        }


        .info-value {
            font-size: 13px;
            text-align: right;
        }


        .rarity {
            font-weight: bold;
            letter-spacing: 1px;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .sell-button,
        .decorate-button {
            width: 100%;
            margin-top: 10px;
            padding: 14px 20px;
            background: black;
            color: white;
            border: none;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }


        .sell-button:hover,
        .decorate-button:hover {
            background: #333333;
        }


        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            border: 1px solid black;
            color: black;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.2s;
        }


        .back-button:hover {
            background: black;
            color: white;
        }


        /* =========================================
           DECORATION PANEL
        ========================================= */

        .decoration-panel {
            margin-top: 20px;
            border-top: 1px solid black;
            padding-top: 25px;
        }


        .decoration-title {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }


        .decoration-subtitle {
            font-size: 11px;
            line-height: 1.5;
            margin-bottom: 20px;
        }


        .decoration-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }


        .decoration-item {
            border: 1px solid #dddddd;
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
        }


        .decoration-item:hover {
            border-color: black;
            transform: translateY(-2px);
        }


        .decoration-item img {
            width: 100%;
            height: 75px;
            object-fit: contain;
            display: block;
        }


        .decoration-rarity {
            text-align: center;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 7px;
        }


        .decoration-count {
            text-align: center;
            font-size: 8px;
            margin-top: 3px;
        }


        .no-decorations {
            font-size: 11px;
            line-height: 1.5;
            padding: 15px;
            border: 1px solid #dddddd;
        }


        .current-decoration {
            margin-top: 15px;
            font-size: 10px;
            letter-spacing: 1px;
            font-weight: bold;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {
            text-align: center;
        }


        .error h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }


            .nav-links {
                gap: 15px;
            }


            .nav-links a {
                font-size: 9px;
            }


            .card-info {
                grid-template-columns: 1fr;
                gap: 35px;
            }


            .details {
                border-left: none;
                border-top: 1px solid black;
                padding-left: 0;
                padding-top: 30px;
            }


            h1 {
                font-size: 32px;
            }


            .decoration-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav>

        <div class="coins">
            🪙 <span id="coinBalance">0</span>
        </div>


        <div class="nav-links">

            <a href="index.html">HOME</a>

            <a href="store.html">STORE</a>

            <a href="collection.html">COLLECTION</a>

            <a href="market.html">I-DOLL MARKET</a>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="page">

        <div class="card-info" id="cardInfo"></div>

    </main>


    <script>


        /* =========================================
           CARD DATABASE
        ========================================= */

        const cards = {

            "IMG_6687.PNG": {
                number: "001",
                member: "DAL",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6688.PNG": {
                number: "002",
                member: "DAL",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6689.PNG": {
                number: "003",
                member: "DAL",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6690.PNG": {
                number: "004",
                member: "HAY",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6691.PNG": {
                number: "005",
                member: "HAY",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6692.PNG": {
                number: "006",
                member: "HAY",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6693.PNG": {
                number: "007",
                member: "KOALA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6694.PNG": {
                number: "008",
                member: "KOALA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6695.PNG": {
                number: "009",
                member: "KOALA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6696.PNG": {
                number: "010",
                member: "RIA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6697.PNG": {
                number: "011",
                member: "RIA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6698.PNG": {
                number: "012",
                member: "RIA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6699.PNG": {
                number: "013",
                member: "Z",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6700.PNG": {
                number: "014",
                member: "Z",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6701.PNG": {
                number: "015",
                member: "Z",
                rarity: "COMMON",
                version: "REGULAR"
            }

        };


        /* =========================================
           DECORATION DATABASE
        ========================================= */

        const decorations = {

            "Untitled81_20260929165123.png": {
                rarity: "COMMON"
            },

            "Untitled81_20260929165117.png": {
                rarity: "COMMON"
            },

            "Untitled81_20260929164525.png": {
                rarity: "RARE"
            },

            "Untitled81_20260929164555.png": {
                rarity: "RARE"
            },

            "Untitled81_20260929163250.png": {
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929163300.png": {
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929164023.png": {
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929164032.png": {
                rarity: "LEGENDARY"
            }

        };


        /* =========================================
           GET CARD
        ========================================= */

        const file =
            new URLSearchParams(window.location.search).get("card");


        const card = cards[file];


        const container =
            document.getElementById("cardInfo");


        /* =========================================
           SELL PRICES
        ========================================= */

        const sellPrices = {

            COMMON: 100,

            RARE: 150,

            LEGENDARY: 200

        };


        /* =========================================
           GET DECORATION INVENTORY
        ========================================= */

        function getDecorationInventory() {

            return JSON.parse(
                localStorage.getItem("idollDecorationInventory")
            ) || {};

        }


        /* =========================================
           GET CURRENT DECORATION
        ========================================= */

        function getCurrentDecoration() {

            const applied =
                JSON.parse(
                    localStorage.getItem("idollDecorations")
                ) || {};

            return applied[file] || null;

        }


        /* =========================================
           DISPLAY CARD
        ========================================= */

        if (!card) {


            container.innerHTML = `

                <div class="error">

                    <h1>CARD NOT FOUND</h1>

                    <p>
                        This card doesn't exist in the I-DOLL collection.
                    </p>

                    <a
                        href="collection.html"
                        class="back-button"
                    >
                        BACK TO COLLECTION
                    </a>

                </div>

            `;


        } else {


            const collection =
                JSON.parse(
                    localStorage.getItem("idollCollection")
                ) || {};


            const ownedCount =
                Number(collection[file]) || 0;


            const currentDecoration =
                getCurrentDecoration();


            /* =========================================
               CARD IMAGE + DECORATION
            ========================================= */

            let cardVisual = `

                <div class="card-image">

                    <div class="card-stack">

                        <img
                            class="card-base"
                            src="${file}"
                            alt="${card.member} card"
                        >

                        ${
                            currentDecoration
                            ?
                            `
                                <img
                                    class="card-decoration"
                                    src="${currentDecoration}"
                                    alt="Card decoration"
                                >
                            `
                            :
                            ""
                        }

                    </div>

                </div>

            `;


            /* =========================================
               CARD DETAILS
            ========================================= */

            container.innerHTML = `

                ${cardVisual}


                <div class="details">


                    <div class="small-title">

                        I-DOLL · CARD ${card.number}

                    </div>


                    <h1>

                        ${card.member}

                    </h1>


                    <div class="info-row">

                        <span class="info-label">
                            CARD NUMBER
                        </span>

                        <span class="info-value">
                            ${card.number}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            MEMBER
                        </span>

                        <span class="info-value">
                            ${card.member}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            RARITY
                        </span>

                        <span class="info-value rarity">
                            ${card.rarity}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            VERSION
                        </span>

                        <span class="info-value">
                            ${card.version}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            ALBUM
                        </span>

                        <span class="info-value">
                            PHANTOM OF THE SPADE
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            OWNED
                        </span>

                        <span class="info-value">
                            x${ownedCount}
                        </span>

                    </div>


                    ${
                        currentDecoration
                        ?
                        `
                            <div class="current-decoration">

                                ✦ DECORATED

                            </div>
                        `
                        :
                        ""
                    }


                    ${
                        ownedCount > 1
                        ?
                        `
                            <button
                                class="sell-button"
                                id="sellButton"
                            >
                                SELL 1 DUPLICATE · 🪙 ${sellPrices[card.rarity]}
                            </button>
                        `
                        :
                        ""
                    }


                    ${
                        ownedCount > 0
                        ?
                        `
                            <button
                                class="decorate-button"
                                id="decorateButton"
                            >
                                DECORATE CARD
                            </button>

                            <div
                                class="decoration-panel"
                                id="decorationPanel"
                                style="display:none;"
                            ></div>
                        `
                        :
                        ""
                    }


                    <a
                        href="collection.html"
                        class="back-button"
                    >
                        ← BACK TO COLLECTION
                    </a>


                </div>

            `;


            /* =========================================
               SELL BUTTON
            ========================================= */

            const sellButton =
                document.getElementById("sellButton");


            if (sellButton) {

                sellButton.addEventListener(
                    "click",
                    sellDuplicate
                );

            }


            /* =========================================
               DECORATE BUTTON
            ========================================= */

            const decorateButton =
                document.getElementById("decorateButton");


            if (decorateButton) {

                decorateButton.addEventListener(
                    "click",
                    toggleDecorationPanel
                );

            }

        }


        /* =========================================
           SELL ONE DUPLICATE
        ========================================= */

        function sellDuplicate() {


            let collection =
                JSON.parse(
                    localStorage.getItem("idollCollection")
                ) || {};


            let ownedCount =
                Number(collection[file]) || 0;


            /* DON'T SELL THE LAST COPY */

            if (ownedCount <= 1) {

                return;

            }


            /* REMOVE ONE COPY */

            ownedCount--;


            collection[file] =
                ownedCount;


            localStorage.setItem(
                "idollCollection",
                JSON.stringify(collection)
            );


            /* ADD THE CORRECT COINS */

            let coins =
                Number(
                    localStorage.getItem("idollCoins")
                ) || 0;


            coins += sellPrices[card.rarity];


            localStorage.setItem(
                "idollCoins",
                coins
            );


            /* GO BACK TO COLLECTION */

            window.location.href =
                "collection.html";

        }


        /* =========================================
           OPEN / CLOSE DECORATION PANEL
        ========================================= */

        function toggleDecorationPanel() {


            const panel =
                document.getElementById(
                    "decorationPanel"
                );


            if (!panel) {

                return;

            }


            if (panel.style.display === "none") {

                panel.style.display = "block";

                renderDecorationInventory();

            } else {

                panel.style.display = "none";

            }

        }


        /* =========================================
           RENDER DECORATION INVENTORY
        ========================================= */

        function renderDecorationInventory() {


            const panel =
                document.getElementById(
                    "decorationPanel"
                );


            if (!panel) {

                return;

            }


            const inventory =
                getDecorationInventory();


            const ownedDecorations =
                Object.keys(inventory).filter(
                    decoration =>
                        inventory[decoration] > 0
                );


            if (ownedDecorations.length === 0) {


                panel.innerHTML = `

                    <div class="decoration-title">
                        YOUR DECORATIONS
                    </div>

                    <div class="no-decorations">

                        You don't own any decorations yet.
                        Visit <b>I-DOLL MARKET</b> and buy
                        a PC DECORE pack to get one.

                    </div>

                `;


                return;

            }


            let html = `

                <div class="decoration-title">

                    YOUR DECORATIONS

                </div>


                <div class="decoration-subtitle">

                    Choose a decoration to apply to this card.

                </div>


                <div class="decoration-grid">

            `;


            ownedDecorations.forEach(
                decoration => {


                    const data =
                        decorations[decoration];


                    if (!data) {

                        return;

                    }


                    html += `

                        <div
                            class="decoration-item"
                            onclick="applyDecoration('${decoration}')"
                        >

                            <img
                                src="${decoration}"
                                alt="Decoration"
                            >


                            <div class="decoration-rarity">

                                ${data.rarity}

                            </div>


                            <div class="decoration-count">

                                x${inventory[decoration]}

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                </div>

            `;


            panel.innerHTML = html;

        }


        /* =========================================
           APPLY DECORATION
        ========================================= */

        function applyDecoration(decoration) {


            const inventory =
                getDecorationInventory();


            if (!inventory[decoration] ||
                inventory[decoration] <= 0) {

                return;

            }


            /* =========================================
               GET CURRENTLY APPLIED DECORATION
            ========================================= */

            const applied =
                JSON.parse(
                    localStorage.getItem("idollDecorations")
                ) || {};


            const oldDecoration =
                applied[file] || null;


            /* =========================================
               RETURN OLD DECORATION TO INVENTORY
            ========================================= */

            if (
                oldDecoration &&
                oldDecoration !== decoration
            ) {


                if (inventory[oldDecoration]) {

                    inventory[oldDecoration]++;

                } else {

                    inventory[oldDecoration] = 1;

                }

            }


            /* =========================================
               REMOVE NEW DECORATION FROM INVENTORY
            ========================================= */

            inventory[decoration]--;


            if (inventory[decoration] <= 0) {

                delete inventory[decoration];

            }


            /* =========================================
               APPLY TO THIS CARD
            ========================================= */

            applied[file] =
                decoration;


            /* =========================================
               SAVE EVERYTHING
            ========================================= */

            localStorage.setItem(
                "idollDecorationInventory",
                JSON.stringify(inventory)
            );


            localStorage.setItem(
                "idollDecorations",
                JSON.stringify(applied)
            );


            /* =========================================
               REFRESH PAGE
            ========================================= */

            location.reload();

        }


        /* =========================================
           SHOW COINS
        ========================================= */

        let coins =
            Number(
                localStorage.getItem("idollCoins")
            ) || 0;


        document.getElementById(
            "coinBalance"
        ).textContent = coins;


    </script>


</body>

</html>
