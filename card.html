<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL | Card Info</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            height: 70px;
            border-bottom: 1px solid black;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }


        .coins {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }


        .nav-links {
            display: flex;
            gap: 30px;
        }


        .nav-links a {
            color: black;
            text-decoration: none;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        .nav-links a:hover {
            opacity: 0.5;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 20px;
        }


        .card-info {
            width: 900px;
            max-width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 70px;

            align-items: center;
        }


        /* =========================================
           CARD DISPLAY
        ========================================= */

        .card-image {
            width: 100%;
            max-width: 400px;

            aspect-ratio: 2 / 3;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }


        .card-stack {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card-base {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        .card-decoration {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            pointer-events: none;

            display: none;
        }


        /* =========================================
           DETAILS
        ========================================= */

        .details {
            border-left: 1px solid black;

            padding-left: 45px;
        }


        .small-title {
            font-size: 11px;
            letter-spacing: 2px;

            margin-bottom: 15px;
        }


        h1 {
            font-size: 42px;
            letter-spacing: 2px;

            margin-bottom: 30px;
        }


        .info-row {
            border-top: 1px solid black;

            padding: 18px 0;

            display: flex;
            justify-content: space-between;

            gap: 20px;
        }


        .info-label {
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
        }


        .info-value {
            font-size: 13px;
            text-align: right;
        }


        .rarity {
            font-weight: bold;
            letter-spacing: 1px;
        }


        /* =========================================
           DECORATION BUTTON
        ========================================= */

        .decorate-button {
            width: 100%;

            margin-top: 25px;

            padding: 14px 20px;

            background: white;
            color: black;

            border: 1px solid black;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;
        }


        .decorate-button:hover {
            background: black;
            color: white;
        }


        /* =========================================
           SELL DUPLICATE
        ========================================= */

        .sell-button {
            width: 100%;

            margin-top: 10px;

            padding: 14px 20px;

            background: black;
            color: white;

            border: none;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;
        }


        .sell-button:hover {
            background: #333333;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 25px;

            border: 1px solid black;

            color: black;
            background: white;

            text-decoration: none;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 1px;

            transition: 0.2s;
        }


        .back-button:hover {
            background: black;
            color: white;
        }


        /* =========================================
           DECORATION MODAL
        ========================================= */

        .decoration-modal {
            position: fixed;

            inset: 0;

            background: rgba(255, 255, 255, 0.96);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 30px;
        }


        .decoration-modal.show {
            display: flex;
        }


        .decoration-box {
            width: 700px;
            max-width: 100%;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border: 1px solid black;

            padding: 35px;
        }


        .decoration-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }


        .decoration-header h2 {
            font-size: 22px;
            letter-spacing: 2px;
        }


        .close-button {
            background: none;
            border: none;

            font-size: 24px;

            cursor: pointer;
        }


        .decoration-subtitle {
            font-size: 11px;

            color: #777;

            letter-spacing: 1px;

            margin-bottom: 25px;
        }


        /* =========================================
           DECORATION INVENTORY
        ========================================= */

        .decoration-inventory {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(130px, 1fr));

            gap: 15px;
        }


        .decoration-item {
            border: 1px solid #dddddd;

            padding: 12px;

            cursor: pointer;

            text-align: center;

            transition: 0.15s;
        }


        .decoration-item:hover {
            border-color: black;
        }


        .decoration-item.selected {
            border: 2px solid black;
        }


        .decoration-item.none-option {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            min-height: 150px;
        }


        .none-symbol {
            font-size: 42px;

            margin-bottom: 15px;
        }


        .decoration-item img {
            width: 100%;
            height: 130px;

            object-fit: contain;

            margin-bottom: 10px;
        }


        .decoration-name {
            font-size: 10px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }


        .decoration-count {
            font-size: 10px;

            color: #777;
        }


        .empty-inventory {
            text-align: center;

            padding: 30px;

            font-size: 11px;

            color: #777;
        }


        /* =========================================
           SUCCESS MESSAGE
        ========================================= */

        .decoration-message {
            margin-top: 25px;

            text-align: center;

            font-size: 11px;

            letter-spacing: 1px;

            display: none;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {
            text-align: center;
        }


        .error h1 {
            font-size: 30px;

            margin-bottom: 15px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }


            .nav-links {
                gap: 15px;
            }


            .nav-links a {
                font-size: 9px;
            }


            .card-info {
                grid-template-columns: 1fr;

                gap: 35px;
            }


            .details {
                border-left: none;

                border-top: 1px solid black;

                padding-left: 0;

                padding-top: 30px;
            }


            h1 {
                font-size: 32px;
            }


            .decoration-box {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav>

        <div class="coins">
            🪙 <span id="coinBalance">0</span>
        </div>


        <div class="nav-links">

            <a href="index.html">HOME</a>

            <a href="store.html">STORE</a>

            <a href="collection.html">COLLECTION</a>

            <a href="market.html">I-DOLL MARKET</a>

        </div>

    </nav>


    <!-- =========================================
         CARD PAGE
    ========================================= -->

    <main class="page">

        <div
            class="card-info"
            id="cardInfo"
        ></div>

    </main>


    <!-- =========================================
         DECORATION MODAL
    ========================================= -->

    <div
        class="decoration-modal"
        id="decorationModal"
    >

        <div class="decoration-box">


            <div class="decoration-header">

                <h2>
                    PC DECORE
                </h2>


                <button
                    class="close-button"
                    onclick="closeDecorationInventory()"
                >
                    ×
                </button>

            </div>


            <p class="decoration-subtitle">
                CHOOSE A DECORATION FOR THIS CARD
            </p>


            <div
                class="decoration-inventory"
                id="decorationInventory"
            ></div>


            <div
                class="decoration-message"
                id="decorationMessage"
            ></div>


        </div>

    </div>


    <script>


        /* =========================================
           CARD DATABASE
        ========================================= */

        const cards = {

            "IMG_6687.PNG": {
                number: "001",
                member: "DAL",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6688.PNG": {
                number: "002",
                member: "DAL",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6689.PNG": {
                number: "003",
                member: "DAL",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6690.PNG": {
                number: "004",
                member: "HAY",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6691.PNG": {
                number: "005",
                member: "HAY",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6692.PNG": {
                number: "006",
                member: "HAY",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6693.PNG": {
                number: "007",
                member: "KOALA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6694.PNG": {
                number: "008",
                member: "KOALA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6695.PNG": {
                number: "009",
                member: "KOALA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6696.PNG": {
                number: "010",
                member: "RIA",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6697.PNG": {
                number: "011",
                member: "RIA",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6698.PNG": {
                number: "012",
                member: "RIA",
                rarity: "COMMON",
                version: "REGULAR"
            },

            "IMG_6699.PNG": {
                number: "013",
                member: "Z",
                rarity: "RARE",
                version: "REGULAR"
            },

            "IMG_6700.PNG": {
                number: "014",
                member: "Z",
                rarity: "LEGENDARY",
                version: "I-DOLL VER."
            },

            "IMG_6701.PNG": {
                number: "015",
                member: "Z",
                rarity: "COMMON",
                version: "REGULAR"
            }

        };


        /* =========================================
           DECORATIONS
        ========================================= */

        const decorations = {

            "Untitled81_20260929165123.png": {
                name: "COMMON DECORE 01",
                rarity: "COMMON"
            },

            "Untitled81_20260929165117.png": {
                name: "COMMON DECORE 02",
                rarity: "COMMON"
            },

            "Untitled81_20260929164525.png": {
                name: "RARE DECORE 01",
                rarity: "RARE"
            },

            "Untitled81_20260929164555.png": {
                name: "RARE DECORE 02",
                rarity: "RARE"
            },

            "Untitled81_20260929163250.png": {
                name: "LEGENDARY DECORE 01",
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929163300.png": {
                name: "LEGENDARY DECORE 02",
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929164023.png": {
                name: "LEGENDARY DECORE 03",
                rarity: "LEGENDARY"
            },

            "Untitled81_20260929164032.png": {
                name: "LEGENDARY DECORE 04",
                rarity: "LEGENDARY"
            }

        };


        /* =========================================
           GET CARD
        ========================================= */

        const file =
            new URLSearchParams(
                window.location.search
            ).get("card");


        const card = cards[file];


        const container =
            document.getElementById("cardInfo");


        /* =========================================
           SELLING PRICES
        ========================================= */

        const sellPrices = {

            COMMON: 100,

            RARE: 150,

            LEGENDARY: 200

        };


        /* =========================================
           SHOW CARD
        ========================================= */

        function showCard() {

            if (!card) {

                container.innerHTML = `

                    <div class="error">

                        <h1>
                            CARD NOT FOUND
                        </h1>

                        <p>
                            This card doesn't exist in
                            the I-DOLL collection.
                        </p>

                        <a
                            href="collection.html"
                            class="back-button"
                        >
                            BACK TO COLLECTION
                        </a>

                    </div>

                `;

                return;

            }


            const collection =
                JSON.parse(
                    localStorage.getItem(
                        "idollCollection"
                    )
                ) || {};


            const ownedCount =
                Number(collection[file]) || 0;


            const decorationsApplied =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorations"
                    )
                ) || {};


            const currentDecoration =
                decorationsApplied[file];


            container.innerHTML = `

                <div class="card-image">

                    <div class="card-stack">

                        <img
                            class="card-base"
                            src="${file}"
                            alt="${card.member} card"
                        >


                        <img
                            class="card-decoration"
                            id="cardDecoration"
                            src=""
                            alt="Card decoration"
                        >

                    </div>

                </div>


                <div class="details">

                    <div class="small-title">

                        I-DOLL · CARD
                        ${card.number}

                    </div>


                    <h1>
                        ${card.member}
                    </h1>


                    <div class="info-row">

                        <span class="info-label">
                            CARD NUMBER
                        </span>

                        <span class="info-value">
                            ${card.number}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            MEMBER
                        </span>

                        <span class="info-value">
                            ${card.member}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            RARITY
                        </span>

                        <span class="info-value rarity">
                            ${card.rarity}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            VERSION
                        </span>

                        <span class="info-value">
                            ${card.version}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            ALBUM
                        </span>

                        <span class="info-value">
                            PHANTOM OF THE SPADE
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            OWNED
                        </span>

                        <span class="info-value">
                            x${ownedCount}
                        </span>

                    </div>


                    <button
                        class="decorate-button"
                        onclick="openDecorationInventory()"
                    >
                        DECORATE CARD
                    </button>


                    ${
                        ownedCount > 1
                        ? `

                            <button
                                class="sell-button"
                                onclick="sellDuplicate()"
                            >
                                SELL 1 DUPLICATE · 🪙
                                ${sellPrices[card.rarity]}
                            </button>

                        `
                        : ""
                    }


                    <a
                        href="collection.html"
                        class="back-button"
                    >
                        ← BACK TO COLLECTION
                    </a>

                </div>

            `;


            applyCurrentDecoration();

        }


        /* =========================================
           SHOW CURRENT DECORATION
        ========================================= */

        function applyCurrentDecoration() {

            const decorationImage =
                document.getElementById(
                    "cardDecoration"
                );


            if (!decorationImage) {

                return;

            }


            const applied =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorations"
                    )
                ) || {};


            const decorationFile =
                applied[file];


            if (
                decorationFile &&
                decorations[decorationFile]
            ) {

                decorationImage.src =
                    decorationFile;

                decorationImage.style.display =
                    "block";

            } else {

                decorationImage.style.display =
                    "none";

            }

        }


        /* =========================================
           OPEN DECORATION INVENTORY
        ========================================= */

        function openDecorationInventory() {

            const modal =
                document.getElementById(
                    "decorationModal"
                );


            modal.classList.add("show");


            renderDecorationInventory();

        }


        /* =========================================
           CLOSE DECORATION INVENTORY
        ========================================= */

        function closeDecorationInventory() {

            document
                .getElementById(
                    "decorationModal"
                )
                .classList.remove("show");

        }


        /* =========================================
           RENDER DECORATION INVENTORY
        ========================================= */

        function renderDecorationInventory() {

            const container =
                document.getElementById(
                    "decorationInventory"
                );


            container.innerHTML = "";


            /*
             * NONE IS ALWAYS AVAILABLE.
             * It is NOT stored in the inventory
             * and can NEVER run out.
             */

            const noneItem =
                document.createElement("div");


            noneItem.className =
                "decoration-item none-option";


            const currentApplied =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorations"
                    )
                ) || {};


            if (!currentApplied[file]) {

                noneItem.classList.add(
                    "selected"
                );

            }


            noneItem.innerHTML = `

                <div class="none-symbol">
                    ∅
                </div>

                <div class="decoration-name">
                    NONE
                </div>

                <div class="decoration-count">
                    REMOVE DECORATION
                </div>

            `;


            noneItem.onclick =
                function() {

                    removeDecoration();

                };


            container.appendChild(
                noneItem
            );


            /*
             * LOAD EXISTING INVENTORY
             */

            const inventory =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorationInventory"
                    )
                ) || {};


            let hasDecorations = false;


            Object.keys(decorations)
                .forEach(
                    function(decorationFile) {

                        const count =
                            Number(
                                inventory[
                                    decorationFile
                                ]
                            ) || 0;


                        /*
                         * Only show decorations
                         * that the user actually owns.
                         */

                        if (count <= 0) {

                            return;

                        }


                        hasDecorations = true;


                        const decoration =
                            decorations[
                                decorationFile
                            ];


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "decoration-item";


                        if (
                            currentApplied[file] ===
                            decorationFile
                        ) {

                            item.classList.add(
                                "selected"
                            );

                        }


                        item.innerHTML = `

                            <img
                                src="${decorationFile}"
                                alt="${decoration.name}"
                            >

                            <div class="decoration-name">
                                ${decoration.name}
                            </div>

                            <div class="decoration-count">
                                ×${count} OWNED
                            </div>

                        `;


                        item.onclick =
                            function() {

                                applyDecoration(
                                    decorationFile
                                );

                            };


                        container.appendChild(
                            item
                        );

                    }
                );


            if (!hasDecorations) {

                /*
                 * Don't show an empty message
                 * because NONE is still available.
                 */

            }

        }


        /* =========================================
           APPLY DECORATION
        ========================================= */

        function applyDecoration(
            decorationFile
        ) {

            const inventory =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorationInventory"
                    )
                ) || {};


            const amount =
                Number(
                    inventory[decorationFile]
                ) || 0;


            /*
             * Make sure the user actually owns
             * this decoration.
             */

            if (amount <= 0) {

                return;

            }


            let applied =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorations"
                    )
                ) || {};


            const oldDecoration =
                applied[file];


            /*
             * If the card already has this
             * exact decoration, do nothing.
             */

            if (
                oldDecoration ===
                decorationFile
            ) {

                closeDecorationInventory();

                return;

            }


            /*
             * If another decoration is currently
             * on this card, return that old
             * decoration to the inventory.
             */

            if (
                oldDecoration &&
                decorations[oldDecoration]
            ) {

                inventory[oldDecoration] =
                    (
                        Number(
                            inventory[oldDecoration]
                        ) || 0
                    ) + 1;

            }


            /*
             * Remove the newly selected
             * decoration from inventory.
             */

            inventory[decorationFile] =
                amount - 1;


            /*
             * Clean up zero-count items.
             */

            if (
                inventory[decorationFile] <= 0
            ) {

                delete inventory[
                    decorationFile
                ];

            }


            /*
             * Apply decoration to card.
             */

            applied[file] =
                decorationFile;


            localStorage.setItem(
                "idollDecorationInventory",
                JSON.stringify(
                    inventory
                )
            );


            localStorage.setItem(
                "idollDecorations",
                JSON.stringify(
                    applied
                )
            );


            closeDecorationInventory();


            showCard();

        }


        /* =========================================
           REMOVE DECORATION
        ========================================= */

        function removeDecoration() {

            let applied =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorations"
                    )
                ) || {};


            const oldDecoration =
                applied[file];


            /*
             * If there is no decoration,
             * there is nothing to remove.
             */

            if (!oldDecoration) {

                closeDecorationInventory();

                return;

            }


            let inventory =
                JSON.parse(
                    localStorage.getItem(
                        "idollDecorationInventory"
                    )
                ) || {};


            /*
             * Return the old decoration
             * to the user's inventory.
             */

            if (
                decorations[oldDecoration]
            ) {

                inventory[oldDecoration] =
                    (
                        Number(
                            inventory[oldDecoration]
                        ) || 0
                    ) + 1;

            }


            /*
             * Remove decoration from card.
             */

            delete applied[file];


            localStorage.setItem(
                "idollDecorationInventory",
                JSON.stringify(
                    inventory
                )
            );


            localStorage.setItem(
                "idollDecorations",
                JSON.stringify(
                    applied
                )
            );


            closeDecorationInventory();


            showCard();

        }


        /* =========================================
           SELL ONE DUPLICATE
        ========================================= */

        function sellDuplicate() {

            let collection =
                JSON.parse(
                    localStorage.getItem(
                        "idollCollection"
                    )
                ) || {};


            let ownedCount =
                Number(
                    collection[file]
                ) || 0;


            /*
             * NEVER SELL THE ONLY COPY
             */

            if (ownedCount <= 1) {

                return;

            }


            /*
             * REMOVE ONE COPY
             */

            ownedCount--;

            collection[file] =
                ownedCount;


            localStorage.setItem(
                "idollCollection",
                JSON.stringify(
                    collection
                )
            );


            /*
             * ADD COINS
             */

            let coins =
                Number(
                    localStorage.getItem(
                        "idollCoins"
                    )
                ) || 0;


            coins +=
                sellPrices[
                    card.rarity
                ];


            localStorage.setItem(
                "idollCoins",
                coins
            );


            /*
             * REFRESH
             */

            location.reload();

        }


        /* =========================================
           COIN BALANCE
        ========================================= */

        function updateCoins() {

            const coins =
                Number(
                    localStorage.getItem(
                        "idollCoins"
                    )
                ) || 0;


            document.getElementById(
                "coinBalance"
            ).textContent =
                coins;

        }


        /* =========================================
           CLOSE MODAL WHEN CLICKING OUTSIDE
        ========================================= */

        document
            .getElementById(
                "decorationModal"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeDecorationInventory();

                    }

                }
            );


        /* =========================================
           START
        ========================================= */

        showCard();

        updateCoins();

    </script>

</body>

</html>
