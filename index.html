<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* NAVIGATION */

        nav {
            height: 80px;
            padding: 0 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            color: black;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }


        /* HOME */

        .home {
            min-height: calc(100vh - 80px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .home h1 {
            font-size: 90px;
            font-weight: 700;
            letter-spacing: -4px;

            margin-bottom: 20px;
        }

        .home p {
            max-width: 450px;

            font-size: 14px;
            line-height: 1.7;

            margin-bottom: 35px;
        }


        /* BUTTON */

        .button {
            display: inline-block;

            padding: 14px 28px;

            background: black;
            color: white;

            text-decoration: none;

            font-size: 12px;
            letter-spacing: 1px;

            transition: 0.2s;
        }

        .button:hover {
            background: #333333;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .home h1 {
                font-size: 60px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            I-DOLL
        </div>

        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="store.html">
                STORE
            </a>

            <a href="collection.html">
                COLLECTION
            </a>

        </div>

    </nav>


    <!-- HOME -->

    <main class="home">

        <h1>
            I-DOLL
        </h1>

        <p>
            Welcome to I-DOLL.
            Discover digital albums, collect exclusive
            photocards and see who you pull.
        </p>

        <a href="store.html" class="button">
            ENTER STORE
        </a>

    </main>


</body>

</html>
