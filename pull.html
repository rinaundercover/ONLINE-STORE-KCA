<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-DOLL — Your Pull</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
            text-align: center;
        }

        nav {
            padding: 25px;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            color: black;
            text-decoration: none;
            margin: 0 15px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .result {
            max-width: 800px;
            margin: 70px auto;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 40px auto;
        }

        .card {
            width: 250px;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        button {
            padding: 14px 30px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 250px;
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">HOME</a>
        <a href="store.html">STORE</a>
        <a href="collection.html">COLLECTION</a>
    </nav>

    <div class="result">

        <h1>YOUR PULL</h1>

        <p>PHANTOM OF THE SPADE</p>

        <div class="cards">
            <img id="card1" class="card" src="" alt="Your first photocard">
            <img id="card2" class="card" src="" alt="Your second photocard">
        </div>

        <a href="collection.html">
            <button>COLLECTION</button>
        </a>

    </div>

    <script>

        const cards = [
           "IMG_6687.PNG",
            "IMG_6688.PNG",
            "IMG_6689.PNG",
            "IMG_6690.PNG",
            "IMG_6691.PNG",
            "IMG_6692.PNG",
            "IMG_6693.PNG",
            "IMG_6694.PNG",
            "IMG_6695.PNG",
            "IMG_6696.PNG",
            "IMG_6697.PNG",
            "IMG_6698.PNG",
            "IMG_6699.PNG",
            "IMG_6700.PNG",
            "soyeon.PNG"
        ];

        const firstCard =
            cards[Math.floor(Math.random() * cards.length)];

        const secondCard =
            cards[Math.floor(Math.random() * cards.length)];

        document.getElementById("card1").src = firstCard;
        document.getElementById("card2").src = secondCard;

    </script>

</body>
</html>
